<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English SAGA — Settings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="main.css">
<script src="theme.js"></script>
</head>
<body>

  <main class="stage">
    <div class="device">

      <div class="statusbar" aria-hidden="true">
        <span class="statusbar__time">9:41</span>
        <span class="statusbar__icons">•••</span>
      </div>

      <header class="topbar">
        <h1 class="topbar__title">Settings</h1>
      </header>

      <!-- 色見本(丸ボタン)は settings.js が PALETTES から生成する -->
      <section class="settings-list" aria-label="カラー設定">
        <div class="settings-row settings-row--swatches">
          <span class="settings-row__label" id="textColorLabel">Text Color</span>
          <div class="swatches" id="textColorSwatches" role="group" aria-labelledby="textColorLabel"></div>
        </div>

        <div class="settings-row settings-row--swatches">
          <span class="settings-row__label" id="buttonColorLabel">Button Color</span>
          <div class="swatches" id="buttonColorSwatches" role="group" aria-labelledby="buttonColorLabel"></div>
        </div>

        <div class="settings-row settings-row--swatches">
          <span class="settings-row__label" id="backColorLabel">Back Color</span>
          <div class="swatches" id="backColorSwatches" role="group" aria-labelledby="backColorLabel"></div>
        </div>
      </section>

      <!-- 読みにくい色の組み合わせで APPLY したときだけ表示される -->
      <div class="settings-message" id="contrastMessage" role="alert" hidden></div>

      <footer class="footer">
        <button type="button" class="pill pill--date" id="applyBtn">
          <span class="pill__label">APPLY</span>
        </button>

        <button type="button" class="pill pill--exit" id="cancelBtn">
          <span class="pill__label">Cancel</span>
        </button>
      </footer>

    </div>
  </main>

<script src="settings.js"></script>
</body>
</html>
